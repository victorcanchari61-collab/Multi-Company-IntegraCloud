<app-dialog [open]="open()" (openChange)="openChange.emit($event)">
  <h2 class="mb-4 text-lg font-bold text-foreground">
    {{ isEdit() ? 'Editar rol' : 'Nuevo rol' }}
  </h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label appLabel for="name">Nombre</label>
      <app-input id="name" type="text" formControlName="name" placeholder="Vendedor" [required]="true" />
      @if (form.controls.name.invalid && form.controls.name.touched) {
        <p class="mt-1 text-xs text-destructive">Ingresa el nombre del rol.</p>
      }
    </div>

    <div>
      <label appLabel for="description">Descripción <span class="text-muted-foreground">(opcional)</span></label>
      <textarea appInput id="description" rows="3" formControlName="description"></textarea>
    </div>

    @if (errorMessage()) {
      <p class="rounded-lg bg-destructive/10 px-3 py-2 text-sm text-destructive">{{ errorMessage() }}</p>
    }

    <div class="flex justify-end gap-2 pt-2">
      <button appButton variant="outline" type="button" (click)="openChange.emit(false)">Cancelar</button>
      <button appButton variant="primary" type="submit" [disabled]="saving()">
        {{ saving() ? 'Guardando…' : 'Guardar' }}
      </button>
    </div>
  </form>
</app-dialog>
