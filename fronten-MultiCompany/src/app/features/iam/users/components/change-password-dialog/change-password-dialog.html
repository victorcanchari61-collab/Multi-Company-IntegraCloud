<app-dialog [open]="open()" (openChange)="openChange.emit($event)">
  <h2 class="mb-4 text-lg font-bold text-foreground">Cambiar contraseña</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label appLabel for="newPassword">Nueva contraseña</label>
      <input appInput id="newPassword" type="password" formControlName="newPassword" autocomplete="new-password" />
      @if (form.controls.newPassword.invalid && form.controls.newPassword.touched) {
        <p class="mt-1 text-xs text-destructive">Mínimo 8 caracteres.</p>
      }
    </div>

    <div>
      <label appLabel for="confirmPassword">Confirmar contraseña</label>
      <input
        appInput
        id="confirmPassword"
        type="password"
        formControlName="confirmPassword"
        autocomplete="new-password"
      />
      @if (form.hasError('mismatch') && form.controls.confirmPassword.touched) {
        <p class="mt-1 text-xs text-destructive">Las contraseñas no coinciden.</p>
      }
    </div>

    @if (errorMessage()) {
      <p class="rounded-lg bg-destructive/10 px-3 py-2 text-sm text-destructive">{{ errorMessage() }}</p>
    }

    <div class="flex justify-end gap-2 pt-2">
      <button appButton variant="outline" type="button" (click)="openChange.emit(false)">Cancelar</button>
      <button appButton variant="primary" type="submit" [disabled]="saving()">
        {{ saving() ? 'Guardando…' : 'Guardar' }}
      </button>
    </div>
  </form>
</app-dialog>
