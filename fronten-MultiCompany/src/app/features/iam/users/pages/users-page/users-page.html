@if (!companyId) {
  <app-card>
    <p class="text-sm text-muted-foreground">No hay una empresa activa para gestionar usuarios.</p>
  </app-card>
} @else {
  <div class="space-y-4">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <h1 class="text-xl font-bold text-foreground">Usuarios</h1>
      <div class="flex flex-col gap-2 sm:flex-row sm:items-center">
        <input appInput type="search" placeholder="Buscar por nombre o correo…" [formControl]="search" class="sm:w-64" />
        <button appButton variant="primary" type="button" *appCan="'iam.users.create'" (click)="openCreateDialog()">
          Nuevo usuario
        </button>
      </div>
    </div>

    @if (errorMessage()) {
      <p class="rounded-lg bg-destructive/10 px-3 py-2 text-sm text-destructive">{{ errorMessage() }}</p>
    }

    <app-data-table [columns]="columns" [data]="users()" [loading]="loading()" emptyMessage="No se encontraron usuarios.">
      <ng-template appMobileTitle let-user>{{ user.fullName }}</ng-template>

      <ng-template appCell="fullName" let-user>
        <span class="font-medium text-foreground">{{ user.fullName }}</span>
      </ng-template>

      <ng-template appCell="email" let-user>
        <span class="text-muted-foreground">{{ user.email }}</span>
      </ng-template>

      <ng-template appCell="status" let-user>
        <app-badge [variant]="user.status === ENTITY_STATUS.ACTIVE ? 'success' : 'destructive'">
          {{ user.status === ENTITY_STATUS.ACTIVE ? 'Activo' : 'Anulado' }}
        </app-badge>
      </ng-template>

      <ng-template appCell="actions" let-user>
        <div class="flex gap-1">
          <button
            appButton
            variant="ghost-warning"
            size="icon-sm"
            type="button"
            title="Editar"
            *appCan="'iam.users.edit'"
            (click)="openEditDialog(user)"
          >
            <svg lucidePencil class="size-3.5" [strokeWidth]="2.5"></svg>
          </button>
          <button
            appButton
            variant="ghost-primary"
            size="icon-sm"
            type="button"
            title="Cambiar contraseña"
            *appCan="'iam.users.edit'"
            (click)="openPasswordDialog(user)"
          >
            <svg lucideKeyRound class="size-3.5" [strokeWidth]="2.5"></svg>
          </button>
          <button
            appButton
            [variant]="user.status === ENTITY_STATUS.ACTIVE ? 'ghost-destructive' : 'ghost-success'"
            size="icon-sm"
            type="button"
            [title]="user.status === ENTITY_STATUS.ACTIVE ? 'Desactivar' : 'Reactivar'"
            *appCan="'iam.users.edit'"
            (click)="toggleStatus(user)"
          >
            @if (user.status === ENTITY_STATUS.ACTIVE) {
              <svg lucideUserX class="size-3.5" [strokeWidth]="2.5"></svg>
            } @else {
              <svg lucideUserCheck class="size-3.5" [strokeWidth]="2.5"></svg>
            }
          </button>
        </div>
      </ng-template>
    </app-data-table>
  </div>

  <app-user-form-dialog
    [open]="formDialogOpen()"
    (openChange)="formDialogOpen.set($event)"
    [companyId]="companyId"
    [userId]="editingUserId()"
    (saved)="loadUsers()"
  />

  <app-change-password-dialog
    [open]="passwordDialogOpen()"
    (openChange)="passwordDialogOpen.set($event)"
    [companyId]="companyId"
    [userId]="passwordUserId()"
  />
}
